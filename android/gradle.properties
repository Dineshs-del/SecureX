# Gradle memory — increased to prevent Java heap space during JetifyTransform
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -XX:+UseG1GC

# Disable daemon to prevent stale memory-hogging processes
org.gradle.daemon=false

# Single-threaded build to minimise peak memory
org.gradle.parallel=false
org.gradle.workers.max=1

# AndroidX
android.useAndroidX=true
android.enableJetifier=true

# React Native
reactNativeArchitectures=arm64-v8a
newArchEnabled=true
hermesEnabled=true
edgeToEdgeEnabled=false
android.enableParallelJsonGeneration=false