# Gradle memory — reduced for 8GB RAM systems
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=256m -XX:+HeapDumpOnOutOfMemoryError -XX:+UseG1GC

# Disable daemon to prevent stale memory-hogging processes
org.gradle.daemon=false

# Single-threaded build to minimise peak memory
org.gradle.parallel=false
org.gradle.workers.max=1

# AndroidX
android.useAndroidX=true
android.enableJetifier=true

# React Native
reactNativeArchitectures=arm64-v8a
newArchEnabled=true
hermesEnabled=true
edgeToEdgeEnabled=false
android.enableParallelJsonGeneration=false